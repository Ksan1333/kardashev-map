  EB.part("culture","文化","🎨","人が心の中で作ってきたもの。信仰と宗教、哲学と思想、芸術、遊びとスポーツ、衣食住、暦と祭り。");

  EB.add({id:"religion",ic:"🛐",t:"信仰と宗教",k:"宗教 信仰 神 キリスト教 イスラム教 ヒンドゥー教 仏教 ユダヤ教 シク教 神道 道教 儒教 無宗教 聖書 クルアーン コーラン 祈り 巡礼 寺院 教会 モスク",h:`
    <p class="eblead">世界の人の約4分の3が、何らかの宗教に属しています。宗教は「なぜ生きるのか」「死んだらどうなるのか」「何が善いことか」に答え、人と人をつなぎ、多くの芸術や建築や祭りを生んできました。</p>
    <h4>世界の宗教の割合（2020年）</h4>
    ${bar([["キリスト教",28.8,"#7fb2ff","約23億人"],["イスラム教",25.6,"#6fd2a0","約20億人"],["無宗教（どの宗教にも属さない）",24.2,"#9fb3d6","約19億人"],["ヒンドゥー教",14.9,"#f4b942","約12億人"],["仏教",4.1,"#e6a0c4","約3.2億人"],["そのほかの宗教",2.2,"#d8b48a","約1.7億人（シク教・道教・神道など）"],["ユダヤ教",0.2,"#c99cf2","約1,480万人"]],"%")}
    <p>2010年から2020年の10年で、最も増えたのはイスラム教徒（3億4,700万人増。若い人が多く、子どもの数も多いため）。無宗教の人も増え、キリスト教の割合は下がった。宗教を離れる人は東アジアやヨーロッパ、南北アメリカで多い。</p>
    <h4>おもな宗教</h4>
    ${tbl([["ユダヤ教","古代イスラエル（前1千年紀に形が整う）","聖典はヘブライ語聖書（とくにトーラー＝モーセ五書）","唯一の神と民の契約。律法を守って生きる","世界のユダヤ教徒の85%がイスラエルとアメリカに住む"],["キリスト教","1世紀、ローマ帝国のパレスチナ","イエス。聖典は聖書（旧約・新約）","神の愛と、イエスによる救い。隣人を愛する。カトリック・プロテスタント・正教会など","いちばん多く住むのはサハラ以南のアフリカ（2020年）。中南米・ヨーロッパにも多い"],["イスラム教","7世紀初め（610年ごろ）、アラビア半島のメッカ","預言者ムハンマド。聖典はクルアーン（コーラン）","唯一の神アッラーに従う。五行（信仰告白・1日5回の礼拝・喜捨・断食・メッカ巡礼）。スンナ派が8〜9割、シーア派が1〜2割","中東・北アフリカから南アジア・東南アジアまで。信者が最も多い国はインドネシア"],["ヒンドゥー教","インド。前1500年ごろからのヴェーダの信仰が土台。開いた人はいない","聖典はヴェーダ、ウパニシャッド、『バガヴァッド・ギーター』など","生まれ変わり（輪廻）と、そこからの解放（解脱）。自分の務め（ダルマ）。ヴィシュヌ・シヴァなど多くの神々","信者の9割以上がインドに住む"],["仏教","前5世紀ごろ、北インド","ゴータマ・シッダールタ（ブッダ）。聖典は経典","苦しみの原因は執着。正しい道（八正道）を歩めば苦しみから解き放たれる（悟り）","上座部（スリランカ・東南アジア）、大乗（中国・朝鮮半島・日本・ベトナム）、チベット仏教"],["シク教","15世紀末、インド北西部のパンジャーブ","グル・ナーナク。聖典は『グル・グラント・サーヒブ』","唯一の神、すべての人の平等、奉仕","約2,500万人以上。多くはインドのパンジャーブ州"],["道教・儒教","中国","道教は老子、儒教は孔子に始まるとされる","道教は自然の道（タオ）との調和。儒教は思いやり（仁）や礼儀、家族の秩序。儒教は宗教より道徳・思想とされることも多い","中国・台湾・朝鮮半島・日本・ベトナムの文化に広く溶け込む"],["神道","日本","開いた人も教典もない（神話は『古事記』『日本書紀』に）","山・森・岩・祖先などに宿る多くの神（八百万の神）を敬い、清らかさを大切にする","日本。多くの人は神社の祭りとお寺の行事の両方に関わる"],["民族宗教・先住民の信仰","世界の各地","ふつう聖典を持たず、口伝えで受け継ぐ","祖先や自然の霊を敬う。アフリカ・アメリカ大陸・オセアニアなどに多い","—"]],["宗教","始まり","開いた人・聖典","中心の教え","多い地域"])}
    <h4>宗教が社会でしてきたこと</h4>
    ${cards([["意味を与える","生と死、苦しみ、宇宙の始まりについて、人が納得できる物語を与えてきた。","#7fb2ff"],["道徳の基準","「殺してはいけない」「盗んではいけない」「困っている人を助けよ」など、多くの宗教に共通する決まりがある。","#6fd2a0"],["共同体","祈りや祭りで人が集まり、助け合う。病院・学校・福祉を始めたのが宗教団体だった地域も多い。","#f4b942"],["節目の儀式","誕生・成人・結婚・死を区切る儀式の多くは、宗教から生まれた。","#e6a0c4"],["芸術と建築","大聖堂、モスク、寺院、宗教画、聖歌、写経。人類の芸術の多くは信仰から生まれた。","#c99cf2"],["争いの理由にも","宗教の違いが、戦争や迫害の理由や口実にされてきた。いっぽうで、和解や平和の運動を宗教者が率いた例も多い。","#ff8f8f"]],210)}
    ${src("Pew Research Center「How the Global Religious Landscape Changed From 2010 to 2020」（2025年6月）。割合は2020年。")}
    ${links(map("lineage","文化（言語・宗教・芸術）の系統樹を見る"),see("philosophy","次の章：哲学と思想"))}`});

  EB.add({id:"philosophy",ic:"🤔",t:"哲学と思想",k:"哲学 思想 倫理 道徳 善悪 正義 自由意志 意識 心 存在 認識 ソクラテス プラトン アリストテレス 孔子 老子 ブッダ デカルト カント ニーチェ 功利主義 トロッコ問題 実存主義",h:`
    <p class="eblead">哲学は、当たり前だと思っていることを、もう一度問い直す営みです。「何が本当にあるのか」「私たちは何を知りうるのか」「どう生きるべきか」。科学も、もとは哲学から分かれて生まれました。</p>
    <h4>哲学の分野</h4>
    ${tbl([["形而上学（存在論）","何が本当に存在するのか。時間とは何か。心と体はどうつながるのか"],["認識論","「知っている」とはどういうことか。確かな知識はありうるか"],["倫理学","何が善く、何が悪いのか。どう行動すべきか"],["論理学","正しい推論の形（"+see("logic","数・論理・情報の章")+"も参照）"],["美学","美しいとはどういうことか。芸術とは何か"],["政治哲学・社会哲学","国家はなぜあるのか。正義、自由、平等とは"],["心の哲学","意識とは何か。機械は考えられるか"],["科学哲学","科学は何をしているのか。科学とそうでないものを分けるものは何か"]],["分野","問い"])}
    <h4>今も答えの出ていない大きな問い</h4>
    ${cards([["心と体の問題","脳は電気と化学の信号で動いている。では、赤い色を「赤い」と感じるこの体験（意識）は、どこから生まれるのか。","#c99cf2"],["自由意志","すべてが物理法則で決まっているなら、私たちが「自分で選んだ」と感じることは本当に自由なのか。","#7fb2ff"],["何が正しいか","結果の幸福で決める（功利主義）、守るべき義務で決める（義務論）、よい人柄で決める（徳倫理）。トロッコ問題は、この違いを問う思考実験。","#f4b942"],["私とは誰か","体の細胞は入れ替わり、記憶も変わる。部品をすべて取り替えた船は同じ船か（テセウスの船）。","#6fd2a0"],["確かなものはあるか","デカルトは、すべてを疑っても「疑っている私」だけは疑えないと考えた（我思う、ゆえに我あり）。","#e6a0c4"],["機械は考えられるか","会話で人間と区別できなければ考えているとみなす（チューリング・テスト、1950年）。意味を理解しているとは言えないという反論もある（中国語の部屋）。AIの発達で、この問いは現実の問題になった。","#9fb3d6"]],220)}
    <h4>おもな思想家</h4>

  EB.add({id:"living",ic:"🏠",t:"衣・食・住と暮らし",k:"衣食住 服 衣服 繊維 ポリエステル 綿 食事 主食 米 小麦 トウモロコシ 料理 発酵 調味料 家 住まい スラム 水 トイレ 衛生 電気 料理の燃料 暮らし",h:`
    <p class="eblead">人の暮らしの基本は、着ること、食べること、住むこと。そして、安全な水、トイレ、電気、煙の出ない台所。これらがそろっている人と、そうでない人の差は、いまも大きいのです。</p>
    <h4>衣：毛の少ない体を守る</h4>
    <p>人は体毛が少なく、汗で体を冷やす動物。寒さや日差しから身を守るため、少なくとも数万年前には服を着ていた（骨で作った針は約4万〜5万年前のものが見つかっている）。服は体を守るだけでなく、身分・職業・信仰・美しさを表すものにもなった（着物、サリー、民族衣装、制服）。</p>
    ${bar([["ポリエステル",59,"#7fb2ff","石油から作る化学繊維。リサイクルは約1割"],["綿",19,"#f4d79a","植物の綿花の繊維"],["レーヨンなど",6,"#6fd2a0","木材パルプから作る繊維"],["ナイロン",5,"#c99cf2"],["羊毛など動物の毛",1,"#d8b48a"],["そのほか",10,"#9fb3d6","ポリプロピレン・麻など"]],"%")}

    ${tbl([["火で調理する","少なくとも数十万年前から。調理すると消化がよくなり、病原体も減る"],["保存する","乾かす・塩や砂糖に漬ける・いぶす・発酵させる・冷やす（冷蔵庫は20世紀に普及）"],["発酵させる","微生物の力で味と保存性を高める。パン・チーズ・ヨーグルト・味噌・醤油・キムチ・酒"],["味つけする","塩はどの文化でも欠かせない。コショウなどの香辛料を求めて、15〜16世紀の大航海が始まった"],["宗教の決まり","イスラム教のハラール（豚肉や酒を避ける）、ユダヤ教のコーシャ、多くのヒンドゥー教徒は牛肉を食べない、仏教の精進料理"],["食べ方","手で食べる（南アジア・中東・アフリカなど）、箸（東アジア）、ナイフとフォーク（ヨーロッパなど）。どれも長い歴史を持つ作法"]],["","内容"])}
    <h4>住：気候と材料で決まる家の形</h4>
    ${cards([["石・れんが・土","乾いた地域では日干しれんがや土の厚い壁が、昼の暑さと夜の寒さをやわらげる。","#d8b48a"],["木","森の多い地域。日本の木造建築は、地震で揺れても倒れにくいしくみを発達させた。","#6fd2a0"],["高床","雨が多く湿った熱帯や、洪水の多い土地。風を通し、水や動物を避ける。","#7fb2ff"],["移動する家","モンゴルのゲルなど、遊牧の人々は組み立てて運べる家に住む。","#f4b942"],["コンクリートの高層住宅","都市に人が集まった20世紀に広がった。コンクリートは、水の次に人類が多く使う物質とされる。","#9fb3d6"],["雪や氷","北極圏のイヌイットは、狩りの旅で雪のブロックの家（イグルー）を作った。","#e8eef9"]],200)}
    <p>いっぽうで、世界の都市に住む人のうち約11億人が、スラムや、水・トイレ・丈夫な家のそろわない住まいに暮らしている。</p>
    <h4>水・トイレ・電気・台所</h4>
    ${tbl([["安全な飲み水（家にあり、汚れておらず、いつでも使える）","74%","約21億人が使えない。うち約1億600万人は川や池の水をそのまま飲む"],["安全なトイレ（汚物が衛生的に処理される）","58%","約34億人が使えない。うち約3億5,400万人は屋外で用を足す"],["家で石けんと水で手を洗える","約8割","約17億人が使えない。うち約6億1,100万人は手を洗う設備がまったくない"],["電気","92%","約6億5,500万人が使えない。うち5億6,000万人以上がサハラ以南のアフリカ"],["煙の出ない料理（ガス・電気など）","約75%","約20億人が、まき・炭・灯油などで料理する。煙は肺や心臓の病気の原因になる"]],["","使える人の割合（2024年）","使えない人"])}
    ${note("飲み水とトイレが整うと、下痢などの感染症で亡くなる子どもが大きく減る。電気があれば夜に勉強でき、冷蔵庫でワクチンを保存できる。暮らしの基本は、健康・教育・仕事のすべての土台になる。","cool")}
    ${src("繊維：Textile Exchange「Materials Market Report」2025年版（2024年の内訳）・2026年版（2025年の生産量）。水・トイレ・手洗い：WHO・UNICEF共同監視プログラム（JMP、2025年）。電気・料理：「Tracking SDG7」2026年版。スラム：国連ハビタット（2022年）。")}
    ${links(see("cities","家族・人口・都市の章へ"))}`});

  EB.add({id:"calendar",ic:"📅",t:"暦と時間・祭り",k:"暦 カレンダー グレゴリオ暦 うるう年 太陰暦 イスラム暦 旧暦 農暦 元号 令和 西暦 曜日 1週間 時刻 時差 タイムゾーン 協定世界時 UTC うるう秒 原子時計 祭り 祝日 正月 春節 クリスマス ラマダン ディーワーリー",h:`
    <p class="eblead">人類は、空の動きで時間を区切ってきました。地球が1回まわると1日、月が満ち欠けすると1か月、太陽のまわりを1周すると1年。この3つがきれいに割り切れないことが、暦づくりの苦労の始まりでした。</p>
    <h4>時間の単位のもと</h4>
    ${tbl([["1日","地球の自転","太陽が南にきてから次に南にくるまで平均24時間。星を基準にすると23時間56分4秒"],["1か月","月の満ち欠け","新月から次の新月まで約29.53日"],["1年","地球が太陽を1周","季節がひとまわりするのは約365.2422日"],["1週間","天体の周期ではない","7日は古代メソポタミアやユダヤ教に由来する。曜日の名前は、肉眼で見える7つの天体（太陽・月・火星・水星・木星・金星・土星）にちなむ"]],["単位","もと","長さ"])}
    <h4>世界の暦</h4>
    ${tbl([["グレゴリオ暦（太陽暦）","1582年、ローマ教皇グレゴリウス13世が定めた。いま世界の共通の暦","4で割り切れる年はうるう年（2月29日）。ただし100で割り切れる年は平年、400で割り切れる年はうるう年。平均365.2425日で、季節とのずれは3,000年あまりで1日。日本は1873年（明治6年）から"],["ユリウス暦","前45年、ユリウス・カエサル","4年に1度うるう年。1年が平均11分長く、16世紀には季節と10日ずれていた。正教会の一部はいまも祝日に使う（クリスマスが1月7日になる）"],["イスラム暦（太陰暦）","622年（ムハンマドがメッカからメディナへ移った年）が紀元","月の満ち欠けだけで決めるので1年は354日か355日。断食月ラマダンは毎年約11日ずつ早くなり、約33年で季節をひとまわりする"],["中国の農暦（太陰太陽暦）","古代中国から。日本の旧暦も同じしくみ","月の満ち欠けで月を決め、約3年に1度「うるう月」を入れて季節に合わせる。季節の目安に二十四節気を使う。春節（旧正月）は1月下旬〜2月中旬"],["ユダヤ暦（太陰太陽暦）","古代イスラエルから","19年に7回うるう月を入れる"],["ヒンドゥー暦","インドの各地で多くの種類","祭りの日を決めるのに使われる"],["元号（和暦）","645年の「大化」から","いまは「令和」（2019年5月1日〜）。2026年は令和8年。元号を使い続けている国は、いまでは日本だけとされる"]],["暦","始まり","しくみ"])}
    <p>西暦は、6世紀にキリストの生まれた年を基準に数え始めたもの（実際の誕生は前4年ごろとされる）。0年はなく、前1年の次は1年になる。ほかにも、タイの仏暦（2026年＝2569年）、イランの太陽暦など、国によって暦が違う。</p>
    <h4>時刻と時差</h4>
    ${tbl([["1秒","1967年から、セシウム原子が出す光（電磁波）の振動の9,192,631,770回分と決められている。それ以前は地球の自転が基準だった"],["協定世界時（UTC）","世界の時刻の基準。原子時計の時刻を、地球の自転とのずれが0.9秒以内になるように調整したもの"],["うるう秒","地球の自転は少しずつ揺らぐため、1972年から27回、1秒を足してきた（最後は2016年12月31日）。2022年の国際会議で、2035年までにうるう秒をやめることが決まった"],["時差（時間帯）","経度15度で1時間ずれる。UTCより12時間遅い所から14時間進んだ所まで、世界には約38の時差がある。インド（＋5時間30分）やネパール（＋5時間45分）のように30分・45分単位の国もある"],["国土と時間帯","中国は東西に広いが、時間帯は1つ（UTC＋8）。時間帯が最も多い国は、海外の領土を含めたフランス（12）"],["日付変更線","太平洋のほぼ経度180度の線。西へ越えると日付が1日進む"]],["","内容"])}
    <h4>世界の祭りと祝日</h4>
    ${tbl([["新年","1月1日（世界の多く）、春節（中国・東アジアの旧正月）、ノウルーズ（春分の日、イラン・中央アジア）","家族が集まり、新しい年の幸せを願う"],["キリスト教","クリスマス（12月25日、イエスの誕生）、イースター（春分の後の最初の満月の次の日曜日、イエスの復活）","世界で最も多くの人が祝う祭りのひとつ"],["イスラム教","イード・アル＝フィトル（ラマダン明けの祭り）、犠牲祭（メッカ巡礼の時期）","イスラム暦で決まるので、毎年約11日ずつ早くなる"],["ヒンドゥー教","ディーワーリー（10〜11月、光の祭り）、ホーリー（3月ごろ、色の粉をかけ合う春の祭り）","明かりを灯し、色を分かち合う"],["仏教","ウェーサク（ブッダの誕生・悟り・死をしのぶ）、日本の花祭り（4月8日）とお盆","地域によって日付が違う"],["ユダヤ教","過越祭（エジプト脱出を記念）、ハヌカ（12月ごろ、光の祭り）","ユダヤ暦で決まる"],["収穫と死者","中秋節（月を眺める）、アメリカの感謝祭（11月第4木曜日）、メキシコの死者の日（11月1〜2日）","実りに感謝し、祖先をしのぶ"]],["","おもな祭り","内容"])}
    ${src("時間の単位：国際度量衡局（BIPM）、国際地球回転・基準系事業（IERS）。うるう秒の廃止：第27回国際度量衡総会（2022年）の決議。")}
    ${links(map("timeline","年表で時の流れを見る"),see("num","数と単位の章へ"))}`});
})();

/* 第9部：技術 */
(function(){
  const {bar,tbl,fig,dots,map,see,cards,flow,note,src,links}=EB;
  EB.part("tech","技術","⚙️","道具と材料、エネルギー、乗り物と物流、通信とコンピュータとAI、医療の技術、農業と食料生産、宇宙開発。");

  EB.add({id:"tech",ic:"⚙️",t:"技術の歩み",k:"技術 発明 道具 石器 火 農耕 車輪 印刷 蒸気機関 産業革命 電気 コンピュータ インターネット AI イノベーション",h:`
    <p class="eblead">人類の技術は、加速しながら積み重なってきました。石器を使い始めてから農耕までに約330万年、農耕から産業革命までに約1万2,000年、産業革命から月面着陸まで約200年、インターネットから生成AIまでは約30年です。</p>
    <h4>大きな転換点</h4>
    ${tbl([["約330万年前","石器","ケニアで見つかった最古の石器は、ホモ・サピエンスより前の人類が作った"],["少なくとも数十万年前","火の利用","暖をとり、獣を遠ざけ、食べ物を調理する"],["約1万2,000年前","農耕と牧畜","食べ物を「育てる」ようになり、定住と人口の増加が始まった"],["約6,000〜5,000年前","金属・車輪・文字","青銅器、車輪つきの乗り物、記録のための文字"],["1450年ごろ","活版印刷","グーテンベルク。知識が大量に複製されるようになった"],["1760年ごろ〜","蒸気機関と産業革命","石炭の力で機械を動かし、工場で大量に作るようになった"],["1880年代","電気","発電所と電灯。モーターで機械を動かし、夜を明るくした"],["1940年代","原子力・コンピュータ","原子核のエネルギーと、電子で計算する機械"],["1957年〜","宇宙飛行","人工衛星、そして人が宇宙へ"],["1990年代","インターネットとWWW","世界中のコンピュータと人がつながった"],["2020年代","生成AI","文章・画像・プログラムを作るAIが広く使われるようになった"]],["いつ","技術","変わったこと"])}
    <h4>技術はなぜ加速するのか</h4>
    ${cards([["積み重なる","新しい技術は前の技術の上に作られる。印刷が知識を広め、知識が次の発明を生む。","#7fb2ff"],["人が増える","発明する人の数が増えるほど、発明も増える。人口は200年で8倍になった。","#6fd2a0"],["つながる","交易・印刷・インターネットで、離れた場所の発明が組み合わさる。","#f4b942"],["エネルギーが増える","使えるエネルギーが増えるほど、できることが増える。カルダシェフの尺度はこれを文明の物差しにしたもの。","#c99cf2"]],200)}
    ${links(map("lineage","技術の系統樹を見る"),map("timeline","年表で見る"),see("energy","エネルギーの章へ"))}`});

  EB.add({id:"materials",ic:"🧱",t:"材料",k:"材料 素材 石 青銅 鉄 鋼鉄 セメント コンクリート アルミニウム 銅 プラスチック ガラス 半導体 シリコン トランジスタ 石器時代 青銅器時代 鉄器時代",h:`
    <p class="eblead">時代の名前に材料が使われるほど、材料は文明を決めてきました。石器時代、青銅器時代、鉄器時代。そしていまは、コンクリートと鋼鉄とプラスチックとシリコンの時代です。</p>
    <h4>材料の歴史</h4>
    ${tbl([["石","約330万年前〜","割って刃を作る。黒曜石の刃はいまのメスより鋭いこともある"],["土器・れんが","約2万年前〜（土器）","粘土を焼くと固くなる。日本の縄文土器は世界最古級"],["銅・青銅","約7,000〜5,000年前〜","銅にスズを混ぜた青銅は硬く、武器や道具になった"],["鉄","約3,000年前〜（広まった時期）","鉄鉱石は多いが、溶かすには高い温度が要る。炭素を少し混ぜた鋼は強くしなやか"],["ガラス","約4,500年前〜","砂（ケイ素の酸化物）を溶かして作る。のちにレンズ・窓・光ファイバーになった"],["セメント・コンクリート","古代ローマ〜、いまの形は19世紀〜","石灰石を焼いて作る。砂利と水と混ぜると岩のように固まる"],["アルミニウム","19世紀末〜","軽くさびにくいが、作るのに大量の電気が要る"],["プラスチック","20世紀〜","石油から作る。軽く、形を自由に作れ、安い。いっぽうで自然の中で分解されにくい"],["半導体（シリコン）","1950年代〜","電気を流したり止めたりできる。コンピュータの心臓部"]],["材料","いつから","特徴"])}
    <h4>人類は1年にどれだけ作っているか（2024〜2025年）</h4>
    ${bar([["セメント",38,"#9fb3d6","約38億トン（2025年）。約半分が中国"],["鋼鉄（粗鋼）",18,"#7fb2ff","約18億トン（2025年）。半分あまりが中国"],["プラスチック",4.3,"#f4b942","約4.3億トン（2024年）。アジアが57%"],["アルミニウム（新しく作ったもの）",0.74,"#c99cf2","約7,400万トン（2025年）。約6割が中国"]],"億トン")}
    <p>コンクリートは、水の次に人類が多く使う物質とされる。セメントを作るときには大量の二酸化炭素が出て、世界の排出の約8%を占めるとも言われる。プラスチックのうち、リサイクルなどで作られたものはまだ約1割にすぎない。</p>
    <h4>半導体：髪の毛の1万分の1の部品</h4>
    ${tbl([["1947年","トランジスタの発明（アメリカ・ベル研究所）","電気の流れを小さな部品でオン・オフできるようになった"],["1958年","集積回路（IC）","多くのトランジスタを1枚の板にまとめる"],["1971年","最初のマイクロプロセッサ（インテル4004）","トランジスタ約2,300個"],["1965年〜","ムーアの法則","チップの上のトランジスタの数は、約2年ごとに倍になってきた（経験則）"],["2020年代","AI用の最先端チップ","1つのチップ（パッケージ）に2,000億個以上のトランジスタ。いちばん細かい部分は数ナノメートル〜数十ナノメートル（髪の毛の太さの約1万分の1〜千分の1）"]],["いつ","できごと","内容"])}
    <p>最先端の半導体を作れる工場は世界でも限られ、台湾・韓国・アメリカなどに集中している。半導体は、いまや石油と並ぶ戦略物資になった。</p>
    ${src("セメント：USGS「Mineral Commodity Summaries 2026」。粗鋼：worldsteel（2026年1月発表、2025年に報告した70か国で約18億トン）。プラスチック：Plastics Europe「Plastics the Fast Facts 2025」（2024年、4億3,090万トン）。アルミニウム：国際アルミニウム協会（2025年、7,378万トン）。")}
    ${links(see("matter","物質のなりたちの章へ"),map("micro","ミクロの世界で原子を見る"))}`});

  EB.add({id:"energy",ic:"⚡",t:"エネルギー",k:"エネルギー 電気 発電 石油 石炭 天然ガス 原子力 再生可能エネルギー 太陽光 風力 水力 カルダシェフ 電力 二酸化炭素 脱炭素 電気自動車",h:`
    <p class="eblead">人類は1年に600EJ（エクサジュール）を超えるエネルギーを使っています。平均すると約19兆ワット。1人あたりでは約2,300ワットで、体が食べ物から使うエネルギー（約100ワット）の20倍以上です。</p>
    <h4>何からエネルギーを得ているか（2025年）</h4>
    ${bar([["石油",33,"#d8b48a","201.0EJ。おもに乗り物の燃料"],["石炭",28,"#8a8f9e","166.0EJ。おもに発電と製鉄"],["天然ガス",25,"#7fb2ff","150.7EJ。発電・暖房・工場"],["再生可能エネルギー（風力・太陽光など）",5.9,"#6fd2a0"],["原子力",5.2,"#c99cf2"],["水力",2.7,"#5fa8e8"]],"%")}
    <p>いまも約86%を化石燃料（石油・石炭・天然ガス）に頼っている。化石燃料は、何億年も前の生き物が地中で変化したもので、燃やすと二酸化炭素が出る。2025年にエネルギーから出た二酸化炭素は約358億トンで、過去最多だった。</p>
    <p>2026年には、中東の戦争で、世界の石油の約2割が通るホルムズ海峡がふさがれ、石油と天然ガスの値段が急に上がった。エネルギーをどこから得るかは、気候の問題であると同時に、安全保障の問題でもある。</p>
    <h4>電気は急速に変わっている（2025年の発電量）</h4>
    ${bar([["石炭",33.0,"#8a8f9e"],["天然ガス",22,"#7fb2ff"],["水力",14,"#5fa8e8"],["原子力",8.9,"#c99cf2"],["太陽光",8.7,"#f4d79a"],["風力",8.5,"#6fd2a0"],["そのほか（バイオマス・石油など）",5,"#9fb3d6"]],"%")}
    <p>2025年、<b>再生可能エネルギー（水力・太陽光・風力など）の発電量が合計33.8%となり、初めて石炭（33.0%）を上回った</b>。原子力を合わせた「二酸化炭素を出さない電気」は43%。2025年に増えた電気の使用量の約4分の3を、太陽光の増加だけでまかなった。</p>
    <h4>エネルギーの単位</h4>
    ${tbl([["1ジュール（J）","リンゴ1個（約100g）を1m持ち上げるエネルギー"],["1キロカロリー（kcal）","4,184J。水1リットルを1℃温める"],["1キロワット時（kWh）","360万J。電気代の単位"],["1ワット（W）","1秒あたり1Jを使う速さ"],["1エクサジュール（EJ）","10¹⁸J。日本が1年に使うエネルギーは約17EJ"]],["単位","大きさ"])}
    <h4>カルダシェフの尺度で見ると</h4>
    <p>文明が使うエネルギーの量で文明を測る考え方（1964年、ソ連の天文学者カルダシェフ）。カール・セーガンの式 K＝(log₁₀P − 6) ÷ 10（Pはワット）に、人類の約1.9×10¹³Wを入れると <b>K≈0.73</b>。Type I（惑星のエネルギーを使いこなす文明、約10¹⁶W）には、いまの約500倍が必要になる。地球に届く太陽の光は約1.7×10¹⁷Wで、人類が使う量の約9,000倍ある。</p>
    ${note("エネルギーは文明の力そのものだが、化石燃料を燃やし続けると気候が変わる。「エネルギーを増やしながら、二酸化炭素を減らす」ことが、21世紀の人類の最大の課題のひとつになっている（"+see("issues","いま地球が抱える課題")+"）。","warn")}
    ${src("Energy Institute「Statistical Review of World Energy 2026」（2025年の一次エネルギーと二酸化炭素）。Ember「Global Electricity Review 2026」（2025年の発電量。天然ガス・水力・そのほかは概数）。")}
    ${links(map("overview","文明マップでエネルギーの歩みを見る"),see("force","力・運動・エネルギーの章へ"))}`});

  EB.add({id:"transport",ic:"🚄",t:"乗り物と物流",k:"乗り物 交通 物流 車輪 馬 船 帆船 鉄道 蒸気機関車 自動車 飛行機 ジェット機 新幹線 高速鉄道 コンテナ船 電気自動車 EV 速さ",h:`

    ${src("飛行機：IATA（2025年は見込み値、2026年は予測）。電気自動車：IEA「Global EV Outlook 2026」。中国の高速鉄道：中国国家鉄路集団（2025年末）。パーカー・ソーラー・プローブ：NASA（2024年12月、秒速約192km）。")}

  EB.add({id:"comms",ic:"📱",t:"通信・コンピュータ・AI",k:"通信 電信 電話 ラジオ テレビ インターネット スマートフォン 携帯電話 5G 海底ケーブル 人工衛星 コンピュータ スーパーコンピュータ AI 人工知能 生成AI 機械学習 ChatGPT データ",h:`
    <p class="eblead">かつて、遠くへ知らせを届ける速さは、人や馬や船の速さと同じでした。電気の信号を使うようになってから、情報は光の速さで地球を回るようになりました。そしていま、機械が言葉を話し始めています。</p>
    <h4>通信の歩み</h4>
    ${tbl([["古代〜","のろし・飛脚・伝書バト","人や動物が運ぶ"],["1837年","電信（モールス信号）","電線で文字を送る。1866年に大西洋の海底ケーブルが開通"],["1876年","電話","声を電気の信号にして送る"],["1900年代","ラジオ（無線）","電線なしで、多くの人に同時に届ける"],["1920〜30年代","テレビ","映像を送る"],["1969年","インターネットの始まり（ARPANET）","コンピュータどうしをつなぐ"],["1991年","ワールド・ワイド・ウェブ（WWW）","リンクでページをたどるしくみ。誰でもインターネットを使えるようになった"],["2007年〜","スマートフォンの普及","電話・カメラ・地図・財布・テレビが手のひらに"]],["いつ","技術","内容"])}
    <h4>つながる世界（2025年）</h4>
    ${tbl([["インターネットを使う人","約60億人（世界の74%）。2019年は54%だった"],["使えていない人","約22億人。その96%は低・中所得の国に住む"],["国の豊かさによる差","高所得国では94%、低所得国では23%"],["5G（第5世代の携帯電話）","約30億契約。携帯電話の高速通信の約3分の1"],["海底ケーブル","大陸と大陸の間を行き来するデータのほとんど（99%以上とされる）は、海の底の光ファイバーで運ばれる"],["人工衛星","2026年10月に動いている人工衛星は約1万6,000〜1万7,000機。その約3分の2が、宇宙からインターネットを届けるスターリンク"]],["","数字"])}
    <h4>コンピュータ</h4>
    <p>コンピュータは、0と1（電気が流れる・流れない）の組み合わせで、計算・記憶・判断を行う機械（しくみは${see("info","情報とコンピュータの章")}）。1946年の初期のコンピュータENIACは、1秒に約5,000回の足し算をした。2026年に世界で最も速いスーパーコンピュータ（中国の「LineShine」）は、1秒に約2.2×10¹⁸回（2.2エクサ）の計算をする。80年で約400兆倍速くなった。</p>
    <h4>人工知能（AI）</h4>
    ${tbl([["1950年","チューリングが「機械は考えられるか」を問う"],["1956年","「人工知能」という言葉が生まれる（アメリカのダートマス会議）"],["1997年","チェスのAIが世界王者に勝つ"],["2012年","深層学習（たくさんの層を持つニューラルネットワーク）が画像認識で大きく進歩"],["2016年","囲碁のAIがトップ棋士に勝つ"],["2017年","文章を扱う新しいしくみ「トランスフォーマー」"],["2020年","AlphaFoldがタンパク質の形をほぼ正確に予測（2024年ノーベル化学賞）"],["2022年〜","対話型の生成AI（ChatGPT・Gemini・Claudeなど）が広まる。ChatGPTだけで2026年2月に週9億人が利用"]],["年","できごと"])}
    <p>いまの生成AIは、膨大な文章や画像から規則性を学び、「次にくるもっともらしい言葉」を予測して文章を作る。文章を書く・訳す・プログラムを書くことが得意ないっぽう、もっともらしい誤り（ハルシネーション）を言うこともある。AIをどう安全に使うか、仕事や教育がどう変わるかは、いま世界中で議論されている。</p>
    ${src("インターネット：ITU「Facts and Figures 2025」。人工衛星：CelesTrak・KeepTrackのデータ（2026年10月）。スーパーコンピュータ：TOP500（2026年6月・11月のリストで1位、HPLで2.198エクサフロップス）。ChatGPT：OpenAIの発表（2026年2月）。")}
    ${links(see("info","情報とコンピュータの章へ"),see("philosophy","機械は考えられるか（哲学）"))}`});

  EB.add({id:"medtech",ic:"💉",t:"医療の技術",k:"医療 医学 ワクチン 天然痘 抗生物質 ペニシリン 麻酔 手術 レントゲン X線 CT MRI 臓器移植 インスリン mRNA ゲノム編集 CRISPR 薬剤耐性 平均寿命",h:`

    <h4>医療を変えた発見と発明</h4>
    ${tbl([["1796年","種痘（ジェンナー、イギリス）","ウシの天然痘で人の天然痘を防ぐ。ワクチンの始まり"],["1804年","全身麻酔での手術（華岡青洲、日本）","薬で眠らせて乳がんの手術をした"],["1846年","エーテル麻酔（アメリカ）","痛みのない手術が広まった"],["1847年","手洗い（ゼンメルワイス、ハンガリー）","医師の手洗いで、出産後の死亡が大きく減った"],["1860〜80年代","病原体の発見（パスツール、コッホ）","病気の多くは目に見えない微生物が起こすとわかった"],["1895年","X線（レントゲン、ドイツ）","体を切らずに中を見る"],["1921〜22年","インスリン（カナダ）","糖尿病が命に関わる病気でなくなっていった"],["1928年","ペニシリン（フレミング、イギリス）","最初の抗生物質。1940年代に大量生産され、感染症の死亡を大きく減らした"],["1954年","臓器移植（腎臓、アメリカ）","1967年には心臓移植も"],["1970年代","CT・MRI","体の断面の画像を撮る"],["1980年","天然痘の根絶（WHO宣言）","人類が地上からなくした唯一の人の感染症"],["2020年","mRNAワクチン（新型コロナ）","1年足らずで開発された。2023年ノーベル生理学・医学賞"],["2023年","ゲノム編集（CRISPR）による初めての治療薬が承認","鎌状赤血球症などの遺伝性の病気の治療"]],["いつ","発見・発明","変わったこと"])}
    <h4>数字で見る効果と課題</h4>
    ${tbl([["ワクチン","過去50年（1974〜2024年）で、少なくとも1億5,400万人の命を救ったと推計される"],["ポリオ（小児まひ）","野生のウイルスが残るのはパキスタンとアフガニスタンだけになった"],["薬剤耐性菌","抗生物質が効かない細菌で、2021年に約114万人が直接亡くなった。2050年には年約190万人になるおそれがある"],["寿命","世界の平均寿命は73.3歳、健康に暮らせる期間（健康寿命）は62.8歳（2023年）"]],["","内容"])}
    ${note("医療の進歩の恩恵は、まだ世界に平等に届いていない。生まれた国によって、平均寿命には20年以上の差がある。","warn")}
    ${src("ワクチン：WHO ほか、The Lancet（2024年）。薬剤耐性：GRAM、The Lancet（2024年）。寿命：WHO「Global Health Estimates」（2023年）。")}

  EB.add({id:"agri",ic:"🌾",t:"農業と食料生産",k:"農業 農耕 作物 穀物 小麦 米 トウモロコシ サトウキビ 家畜 牧畜 肥料 ハーバー・ボッシュ法 緑の革命 養殖 漁業 食品ロス 飢餓 灌漑",h:`

    <h4>収穫を増やした発明</h4>
    ${tbl([["灌漑","川の水を畑へ引く。メソポタミアやエジプトの文明を支えた"],["すき（犂）と家畜","ウシやウマに土を耕させる"],["輪作","作物を順に替えて、土の栄養を保つ"],["化学肥料（1913年〜）","空気中の窒素からアンモニアを作るハーバー・ボッシュ法。いま世界の人の約半分の食べ物は、この肥料のおかげで作られているとされる"],["緑の革命（1960〜70年代）","収穫の多い品種・肥料・灌漑で、アジアや中南米の穀物の収穫が大きく増えた"],["品種改良・遺伝子組換え","病気や乾燥に強い作物。遺伝子組換え作物の栽培は1996年から"]],["","内容"])}
    <h4>いまの食料生産</h4>
    ${tbl([["作物全体","約99億トン（2023年）。最も重いのはサトウキビ（20億トン以上）、次がトウモロコシ"],["穀物","約30億トン（2025年、過去最多の見込み）。トウモロコシ・小麦・米で9割"],["肥料","約1億9,000万トン（2023年）"],["魚介類","養殖が1億300万トン、漁獲が9,200万トン（2024年）。養殖が漁獲を上回り、全体の53%に。海藻を含めると2億3,500万トン"],["農地","陸地の約3分の1。氷河や砂漠を除いた土地では約半分が農業に使われる"],["捨てられる食べ物","店や家庭で約10億5,000万トン（2022年、売られる食べ物の約19%）。それとは別に、収穫から店に届くまでに約13%が失われる"]],["","数字"])}
    <p>世界全体では全員が食べられるだけの食料が作られているのに、2025年に約6億4,500万人が飢餓に苦しんでいる。足りないのは食料の量より、届け方とお金と平和だと言える。</p>

    ${links(see("food","食べ物と栄養の章へ"),see("living","衣・食・住の章へ"))}`});

  EB.add({id:"space",ic:"🚀",t:"宇宙開発",k:"宇宙開発 ロケット 人工衛星 スプートニク ガガーリン アポロ 月面着陸 国際宇宙ステーション ISS 天宮 アルテミス はやぶさ SLIM スターリンク 宇宙ごみ デブリ 宇宙飛行士 ボイジャー",h:`

    "formula:6"(s,an){const n=1500,p=new Float32Array(n*3);const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(p,3));s.add(new THREE.Points(g,new THREE.PointsMaterial({color:"#7ee0ff",size:.05})));

    "formula:7"(s,an){const g=new THREE.PlaneGeometry(6,4,40,24);const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:"#6a9aff",side:THREE.DoubleSide,flatShading:true}));m.rotation.x=-Math.PI/2.4;s.add(m);

    "formula:9"(s,an){const gs=[];for(let i=0;i<40;i++){const v=V(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(.3+Math.random()*.7);const g=glowS(i%3?"#cfe0ff":"#ffd8a0",.35);g.userData.v=v;s.add(g);gs.push(g);}

    "formula:10"(s,an){const bx=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(4,2.4,2.4)),new THREE.LineBasicMaterial({color:"#888"}));s.add(bx);const ps=[...Array(60)].map(()=>{const m=sph(s,.06,B("#f4b942"));m.userData={x:-1.8+Math.random()*.6,y:(Math.random()-.5)*2,z:(Math.random()-.5)*2,vx:Math.random()*2,vy:Math.random()-.5,vz:Math.random()-.5};return m;});

    // 素粒子
    particle(s,an,id){const P=PARTICLES.find(x=>x[0]===id);const col=PCAT[P[2]][1];const m=sph(s,P[2]==="boson"||P[2]==="hypo"?.35:.55,M(col,{emissive:col,emissiveIntensity:.35,transparent:P[2]==="hypo",opacity:P[2]==="hypo"?.4:1}));m.add(label(id,"#fff",.9));

    mol(s,an,id){const m=MOLS.find(x=>x[0]===id);const A=m[4];const cen=A.reduce((a,b)=>a.add(V(b[1],b[2],b[3])),V(0,0,0)).multiplyScalar(1/A.length);const ext=Math.max(...A.map(a=>V(a[1],a[2],a[3]).distanceTo(cen)))||1;
      const grp=new THREE.Group();s.add(grp);grp.scale.setScalar(Math.min(1.2,2.2/ext));A.forEach(([e,x,y,z])=>{const o=sph(grp,(ATOMR[e]||.8)*.5+.15,M(ATOMCOL[e]||"#ccc"));o.position.set(x-cen.x,y-cen.y,z-cen.z);});

    un(s,an,k){if(SC[k])return SC[k](s,an);
      const pts=(n,f,col,size=.05)=>{const p=[];for(let i=0;i<n;i++)p.push(...f(i));const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));const o=new THREE.Points(g,new THREE.PointsMaterial({color:col,size,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));s.add(o);return o;};
      if(k==="halo"){const d=pts(2500,i=>{const r=Math.pow(Math.random(),.7)*1.8,a=r*2.5+(i%2)*Math.PI+(Math.random()-.5)*.4;return [Math.cos(a)*r,(Math.random()-.5)*.1,Math.sin(a)*r];},"#ffe2b0",.04);const h=sph(s,2.6,new THREE.MeshBasicMaterial({color:"#7a5aff",transparent:true,opacity:.12,depthWrite:false}));an.push(t=>{d.rotation.y=t*.4;h.scale.setScalar(1+Math.sin(t)*.03);});return 6.5;}
      if(k==="expand2"){const a=SC["formula:9"](s,an);const r1=new THREE.Mesh(new THREE.TorusGeometry(1.8,.03,6,60),B("#ff6a6a"));const r2=new THREE.Mesh(new THREE.TorusGeometry(2.2,.03,6,60),B("#6ab0ff"));s.add(r1,r2);return a;}
      if(k==="expand")return SC["formula:9"](s,an);if(k==="pair")return SC["formula:11"](s,an);if(k==="cloud")return SC["formula:6"](s,an);if(k==="entropy")return SC["formula:10"](s,an);
      if(k==="foam"){const g=new THREE.IcosahedronGeometry(1.6,3),b=g.attributes.position.array.slice();s.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:"#6a8aff",wireframe:true,transparent:true,opacity:.6})));
        an.push(t=>{const a=g.attributes.position;for(let i=0;i<a.count;i++){const x=b[i*3],y=b[i*3+1],z=b[i*3+2],f=1+.2*Math.sin(x*5+t*3)*Math.cos(y*4-t*2)*Math.sin(z*3+t*4);a.setXYZ(i,x*f,y*f,z*f);}a.needsUpdate=true;});return 5;}

        an.push(t=>{r.rotation.z=t;const a=f.geometry.attributes.position;P.forEach(([o,r0],i)=>{const k2=((t*.2+i/300)%1),rr=r0*(1-k2)+.7*k2,ang=o+k2*8;a.setXYZ(i,Math.cos(ang)*rr,(Math.random()-.5)*.05,Math.sin(ang)*rr);});a.needsUpdate=true;});return 5.5;}

        const sg=new THREE.SphereGeometry(R,64,32,0,Math.PI*1.5);const uv=sg.attributes.uv;for(let i=0;i<uv.count;i++)uv.setX(i,uv.getX(i)*.75);

      if(k==="cell"){sph(s,1.6,new THREE.MeshStandardMaterial({color:"#9fe8a0",transparent:true,opacity:.25,depthWrite:false}));const m=pts(200,()=>{const a=Math.random()*6.28,u=Math.random()*2-1,r=Math.random()*1.3;return [Math.cos(a)*Math.sqrt(1-u*u)*r,u*r,Math.sin(a)*Math.sqrt(1-u*u)*r];},"#ffd27a",.08);an.push(t=>m.rotation.y=t*.5);return 5;}
      if(k==="planet"){const p=sph(s,.9,M("#c96a3a"));const r=new THREE.Mesh(new THREE.RingGeometry(1.2,1.8,48),new THREE.MeshBasicMaterial({color:"#d8c48a",side:THREE.DoubleSide,transparent:true,opacity:.6}));r.rotation.x=1.2;s.add(r);pts(400,()=>[(Math.random()-.5)*12,(Math.random()-.5)*8,-4-Math.random()*4],"#ffffff",.05);an.push(t=>p.rotation.y=t*.4);return 5;}

        const sp=E.slice(0,8).map(()=>sph(s,.06,B("#7ee0ff")));an.push(t=>sp.forEach((o,i)=>{const [a,b]=E[(i*3+Math.floor(t))%E.length];o.position.copy(a.position).lerp(b.position,t%1);}));return 5;}
      if(k==="graph"){const N=[...Array(12)].map((_,i)=>{const o=sph(s,.12,M("#7fb2ff"));const a=i/12*6.283;o.position.set(Math.cos(a)*1.8,Math.sin(a*2)*.4,Math.sin(a)*1.8);return o;});N.forEach((a,i)=>N.forEach((b,j)=>{if(j>i&&(j-i)%4===1||(j-i)===5)s.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.position,b.position]),new THREE.LineBasicMaterial({color:"#4a5a8a"})));}));

        const z=[14.1,21.0,25.0,30.4,32.9,37.6,40.9,43.3,48.0,49.8];z.forEach(v=>sph(s,.07,B("#f4b942"),0,v*.06-1.6,0));s.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(0,-1.8,0),V(0,1.8,0)]),new THREE.LineBasicMaterial({color:"#f4b942"})));an.push(t=>{});return 5;}
      if(k==="flow"){const P=pts(1500,()=>{const r=.3+Math.random()*2,a=Math.random()*6.28;return [Math.cos(a)*r,(Math.random()-.5)*.6,Math.sin(a)*r];},"#7ee0ff",.04);an.push(t=>{P.rotation.y=-t*.6;P.rotation.x=Math.sin(t*.4)*.3;});return 5;}

    // 原子（詳細パネル用）
    atom(s,an,Z){Z=+Z;const el=ELEMENTS[Z-1];const N=Math.max(0,Math.round(parseFloat(String(el.m).replace(/[\[\]]/g,"")))-Z);const A=Math.min(Z+N,120);const Rr=.08*Math.cbrt(A);

  };
  // ---- 登録と描画 ----
  const io=new IntersectionObserver(es=>es.forEach(e=>{const it=items.find(x=>x.cv===e.target);if(it)it.vis=e.isIntersecting;}),{rootMargin:"100px"});

      it.an.forEach(f=>f(t));const cam=it.cam||(it.cam=new THREE.PerspectiveCamera(40,RW/RH,.1,100));const a=it.th+t*.2;cam.position.set(Math.sin(a)*it.dist*.25,it.dist*.35,it.dist);cam.lookAt(0,0,0);
      if(curW!==it.W){renderer.setSize(it.W,it.H);curW=it.W;}renderer.render(it.sc,cam);const g=it.cv.getContext("2d");if(it.cv.width!==it.W){it.cv.width=it.W;it.cv.height=it.H;}g.drawImage(renderer.domElement,0,0);}}

})();

(()=>{
  const $=id=>document.getElementById(id);
  const {parts,chapters}=EB;
  const byId=Object.fromEntries(chapters.map(c=>[c.id,c]));
  const pById=Object.fromEntries(parts.map(p=>[p.id,p]));
  const pLabel=p=>{const i=parts.indexOf(p);return i===0?"序":`第${i}部`;};
  const nav=$("ebnav"),main=$("ebmain"),side=$("ebside"),q=$("q"),qres=$("qres"),body=document.body;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const plain=h=>h.replace(/<(script|style)[\s\S]*?<\/\1>/g," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim();
  const norm=s=>s.normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

  // ---- 目次 ----
  nav.innerHTML=`<a class="nv-home" href="#" data-id=""><span aria-hidden="true">📘</span>表紙と全体の目次</a>`+parts.map(p=>`<div class="nv-part"><div class="nv-ph"><span aria-hidden="true">${p.ic}</span><small>${pLabel(p)}</small>${p.t}</div>${p.ch.map(c=>`<a class="ch" href="#${c.id}" data-id="${c.id}"><span class="nv-n">${c.n}</span><span>${c.t}</span></a>`).join("")}</div>`).join("");

  // ---- 検索の材料（本文の文字だけ） ----
  const IDX=chapters.map(c=>{const hs=[...c.h.matchAll(/<h4[^>]*>([\s\S]*?)<\/h4>/g)].map(m=>plain(m[1]));const t=plain(c.h);return {c,t,nt:norm(t),nti:norm(c.t+" "+(c.k||"")),hs,nhs:hs.map(norm)};});

  // ---- 3D ----
  let l3d=null;
  function load3d(){if(l3d)return l3d;l3d=new Promise(res=>{const init=()=>{if(!window.L3D&&window.__initL3D){try{window.__initL3D();}catch(e){console.error(e);}}res();};if(window.THREE){init();return;}const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";s.onload=init;s.onerror=()=>res();document.head.appendChild(s);});return l3d;}

  // ---- 表紙 ----
  function cover(pid){
    const last=byId[store.get("eb:last")];
    const tables=(chapters.map(c=>c.h).join("").match(/<table/g)||[]).length;
    main.innerHTML=`<section class="cover">
      <div class="cv-hero"><div><h1>地球大全<small>宇宙人のための地球ガイド</small></h1>
        <p class="eblead">地球の外から来た知的存在が「地球とは何か、人類とは何か」を理解するための手引きです。数と物質から始めて、宇宙・地球・生命・人間・社会・文化・技術・歴史まで、この世界のしくみを順に説明します。</p>
        <div class="cv-act"><a class="btn pri" href="#${chapters[0].id}">最初から読む</a>${last?`<a class="btn" href="#${last.id}">続きから：${esc(last.t)}</a>`:""}<a class="btn" href="index.html">文明マップで見る</a></div></div>
        <div class="cv-stats"><div><b>${parts.length-1}</b><small>部（＋序）</small></div><div><b>${chapters.length}</b><small>章</small></div><div><b>${tables}</b><small>表</small></div><div><b>${IDX.reduce((a,x)=>a+x.hs.length,0)}</b><small>見出し</small></div></div></div>
      <div class="cv-parts">${parts.map(p=>`<section class="cv-part" id="part-${p.id}"><h2><span aria-hidden="true">${p.ic}</span><small>${pLabel(p)}</small>${p.t}</h2><p>${p.desc}</p><ol>${p.ch.map(c=>`<li><a href="#${c.id}"><span class="nv-n">${c.n}</span><span>${c.t}</span></a></li>`).join("")}</ol></section>`).join("")}</div>
      <p class="cv-foot">数字は概数です。年によって変わる数字には、年と出典を添えています（各章の終わりの「出典・注」）。2027年より後のことは予測や想像で、文明マップの「もしもの世界（Type I〜IV）」とつながっています。</p>
    </section>`;
    side.innerHTML="";document.title="地球大全 — 宇宙人のための地球ガイド";
    setOn("");
    if(pid){const el=$("part-"+pid);if(el){el.scrollIntoView({block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600);}}else window.scrollTo(0,0);
  }

  // ---- 章 ----
  let curId=null;
  function chapter(c,sec,terms){
    const p=pById[c.part],prev=chapters[c.n-1],next=chapters[c.n+1];
    main.innerHTML=`<article class="ebch" data-id="${c.id}">
      <nav class="crumb" aria-label="現在地"><a href="#">地球大全</a><span aria-hidden="true">›</span><a href="#part-${p.id}">${pLabel(p)} ${p.t}</a></nav>
      <header class="ebch-h"><span class="ebic" aria-hidden="true">${c.ic}</span><div><small>第${c.n}章</small><h1>${c.t}</h1></div></header>
      <ul class="outl" aria-label="この章の見出し"></ul>
      ${c.c3d?`<canvas class="c3d ebc3d" data-k="${c.c3d}" data-hi="2" aria-label="${esc(c.t)}の立体図"></canvas>`:""}
      <div class="ebbody">${c.h}</div>
    </article>
    <nav class="ebpager" aria-label="前後の章">${prev?`<a class="pv" href="#${prev.id}"><small>← 前の章（第${prev.n}章）</small><b>${prev.t}</b></a>`:""}${next?`<a class="nx" href="#${next.id}"><small>次の章（第${next.n}章） →</small><b>${next.t}</b></a>`:`<a class="nx" href="#"><small>おわり</small><b>表紙へ戻る</b></a>`}</nav>`;
    const hs=[...main.querySelectorAll(".ebbody h4")];
    hs.forEach((h,k)=>h.id=`${c.id}.${k+1}`);
    const links=hs.map((h,k)=>`<a href="#${c.id}.${k+1}" data-k="${k+1}">${esc(h.textContent)}</a>`);
    main.querySelector(".outl").innerHTML=links.map(a=>`<li>${a}</li>`).join("");
    if(!hs.length)main.querySelector(".outl").remove();
    side.innerHTML=hs.length?`<b>この章の見出し</b>${links.join("")}`:"";
    document.title=`${c.t} — 地球大全`;
    setOn(c.id);curId=c.id;store.set("eb:last",c.id);
    if(terms&&terms.length)highlight(terms);
    const target=sec?document.getElementById(`${c.id}.${sec}`):main.querySelector("mark.hit");
    if(target)target.scrollIntoView({block:terms&&!sec?"center":"start"});else window.scrollTo(0,0);
    if(main.querySelector("canvas.c3d"))load3d().then(()=>{if(window.L3D)L3D.scan(main);});
    watchSections(hs);
  }
  function setOn(id){nav.querySelectorAll("[data-id]").forEach(a=>{const on=a.dataset.id===id;a.classList.toggle("on",on);if(on){a.setAttribute("aria-current","page");}else a.removeAttribute("aria-current");});
    const a=nav.querySelector(`a.ch[data-id="${id}"]`);if(a){const r=a.getBoundingClientRect(),nr=nav.getBoundingClientRect();if(r.top<nr.top+40||r.bottom>nr.bottom-20)a.scrollIntoView({block:"center"});}}
  // 読んでいる見出しを右の一覧で示す
  let so=null;
  function watchSections(hs){if(so)so.disconnect();if(!hs.length)return;so=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){side.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id));}});},{rootMargin:"-20% 0px -70% 0px"});hs.forEach(h=>so.observe(h));}
  // 検索語を本文の中で光らせる
  function highlight(terms){const root=main.querySelector(".ebch");const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);let n=0;
    for(const tn of nodes){if(n>60)break;const s=tn.nodeValue,ns=norm(s);let hit=-1,len=0;for(const t of terms){const i=ns.indexOf(t);if(i>=0&&(hit<0||i<hit)){hit=i;len=t.length;}}if(hit<0||tn.parentNode.closest("mark,script,style"))continue;
      const m=document.createElement("mark");m.className=n?"":"hit";const r=document.createRange();r.setStart(tn,hit);r.setEnd(tn,Math.min(s.length,hit+len));try{r.surroundContents(m);n++;}catch(e){}}}

  // ---- 行き先（#章 / #章.見出し / #part-部） ----
  let pendingTerms=null;
  function route(){
    const h=decodeURIComponent(location.hash.slice(1));closeNav();
    if(!h){cover();return;}
    if(h.startsWith("part-")){cover(h.slice(5));return;}
    const [id,sec]=h.split(".");const c=byId[id];
    if(!c){cover();return;}
    if(c.id===curId&&sec&&!pendingTerms){const el=document.getElementById(`${c.id}.${sec}`);if(el){el.scrollIntoView({block:"start"});return;}}
    const t=pendingTerms;pendingTerms=null;chapter(c,sec,t);
  }
  window.addEventListener("hashchange",route);

  // ---- 検索 ----
  let sel=-1,res=[];
  function search(raw){
    const terms=norm(raw).split(/[\s　]+/).filter(Boolean);
    if(!terms.length){qres.hidden=true;return;}
    res=[];
    for(const x of IDX){let sc=0,ok=true;for(const t of terms){const inT=x.nti.includes(t),hi=x.nhs.findIndex(h=>h.includes(t)),cnt=x.nt.split(t).length-1;if(!inT&&hi<0&&!cnt){ok=false;break;}sc+=(inT?30:0)+(hi>=0?12:0)+Math.min(cnt,20);}
      if(!ok)continue;const hi=x.nhs.findIndex(h=>terms.some(t=>h.includes(t)));const i=x.nt.indexOf(terms[0]);
      const snip=i>=0?x.t.slice(Math.max(0,i-36),i+70):x.t.slice(0,90);res.push({x,sc,hi,snip});}
    res.sort((a,b)=>b.sc-a.sc);sel=res.length?0:-1;
    const mk=s=>{let o=esc(s);terms.forEach(t=>{const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");o=o.replace(re,m=>`<mark>${m}</mark>`);});return o;};
    qres.innerHTML=`<div class="qh">「${esc(raw)}」— ${res.length}章で見つかりました${res.length>40?"（上位40件）":""}</div>`+res.slice(0,40).map((r,k)=>{const c=r.x.c;return `<a href="#${c.id}${r.hi>=0?"."+(r.hi+1):""}" data-k="${k}" role="option"${k===sel?' class="sel"':""}><b>${mk(c.t)}</b><small>第${c.n}章 ・ ${pLabel(pById[c.part])} ${pById[c.part].t}${r.hi>=0?" ・ "+esc(r.x.hs[r.hi]):""}</small><span>…${mk(r.snip)}…</span></a>`;}).join("")+(res.length?"":`<div class="qh">見つかりませんでした。言い方を変えるか、<a href="index.html" style="display:inline;padding:0;color:var(--cool)">文明マップ</a>の検索も試してください。</div>`);
    qres.hidden=false;qres._terms=terms;
  }
  let qt=0;q.addEventListener("input",()=>{clearTimeout(qt);qt=setTimeout(()=>search(q.value),120);});
  q.addEventListener("focus",()=>{if(q.value.trim())search(q.value);});
  q.addEventListener("keydown",e=>{const items=[...qres.querySelectorAll("a[data-k]")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!items.length)return;sel=(sel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((a,k)=>a.classList.toggle("sel",k===sel));items[sel].scrollIntoView({block:"nearest"});}
    else if(e.key==="Enter"){e.preventDefault();const a=items[Math.max(0,sel)];if(a)a.click();}
    else if(e.key==="Escape"){qres.hidden=true;q.blur();}});
  qres.addEventListener("click",e=>{const a=e.target.closest("a[data-k]");if(!a)return;e.preventDefault();pendingTerms=qres._terms;qres.hidden=true;q.blur();body.classList.remove("srch-open");$("srchb").setAttribute("aria-expanded","false");
    const h=a.getAttribute("href");if(location.hash===h)route();else location.hash=h;});
  document.addEventListener("click",e=>{if(!e.target.closest("#srch"))qres.hidden=true;});
  $("srchb").addEventListener("click",()=>{const on=body.classList.toggle("srch-open");$("srchb").setAttribute("aria-expanded",String(on));if(on)setTimeout(()=>q.focus(),30);else qres.hidden=true;});

  // ---- 目次（スマホ・タブレットは引き出し） ----
  const tocb=$("tocb"),scrim=$("scrim");
  function openNav(){body.classList.add("nav-open");scrim.hidden=false;tocb.setAttribute("aria-expanded","true");const a=nav.querySelector("a.on")||nav.querySelector("a");setTimeout(()=>{if(a)a.scrollIntoView({block:"center"});},30);}
  function closeNav(){if(!body.classList.contains("nav-open"))return;body.classList.remove("nav-open");scrim.hidden=true;tocb.setAttribute("aria-expanded","false");}
  tocb.addEventListener("click",()=>body.classList.contains("nav-open")?closeNav():openNav());
  scrim.addEventListener("click",closeNav);
  nav.addEventListener("click",e=>{if(e.target.closest("a"))closeNav();});

  // ---- キー操作：/ 検索、← → 前後の章、Esc 閉じる ----
  document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(e.key==="Escape"){closeNav();qres.hidden=true;}
    if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==="/"){e.preventDefault();if(innerWidth<768){body.classList.add("srch-open");}q.focus();q.select();}
    else if((e.key==="ArrowRight"||e.key==="ArrowLeft")&&curId&&location.hash){const c=byId[curId];const t=chapters[c.n+(e.key==="ArrowRight"?1:-1)];if(t)location.hash=t.id;}});

  // ---- はじめ ----
  const qs=new URLSearchParams(location.search).get("q");
  route();
  if(qs){q.value=qs;if(innerWidth<768){body.classList.add("srch-open");$("srchb").setAttribute("aria-expanded","true");}search(qs);}
})();
</script>
</body>
</html>
