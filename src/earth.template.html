<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="color-scheme" content="dark">
<meta name="description" content="地球大全：地球の外から来た知的存在のための、地球と人類の手引き。数・物質・宇宙・地球・生命・人間・社会・文化・技術・歴史を、表と図で説明します。">
<title>地球大全 — 宇宙人のための地球ガイド</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b16'/%3E%3Cpath d='M16 9.5c-2.6-2-6.4-2.6-10.5-2v15c4.1-.6 7.9 0 10.5 2 2.6-2 6.4-2.6 10.5-2v-15c-4.1-.6-7.9 0-10.5 2zM16 9.5v15' fill='none' stroke='%23f4b942' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Murecho:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 地球大全：文明マップと同じ色・文字・部品で作った「読むための画面」 */
:root{
  --bg:#070b16;--surface:#10182c;--surface-2:#172038;--surface-3:#1e2a48;
  --line:#25304d;--line-2:#35436c;--ink:#eef2fb;--ink-2:#cdd5e8;--muted:#9ba6c3;
  --accent:#f4b942;--accent-ink:#1a1204;--cool:#7fb2ff;
  --font-display:"Murecho","Noto Sans JP",system-ui,sans-serif;
  --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,monospace;
  --hdH:64px;--navW:290px;--sideW:230px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--hdH) + 16px)}
html,body{margin:0}
body{background:radial-gradient(1200px 700px at 60% 0%,#15204080 0%,transparent 70%),var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--cool)}
button{font-family:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
kbd{font:600 10.5px var(--font-num);padding:1px 6px;border-radius:5px;border:1px solid #3a4670;background:#0b1122;color:#cfd7ea;white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:200;padding:8px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700}.skip:focus{left:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- 上のバー ---- */
.ebh{position:sticky;top:0;z-index:60;height:calc(var(--hdH) + var(--sat));padding:var(--sat) 18px 0;display:flex;align-items:center;gap:12px;background:rgba(8,12,24,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.ibtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;min-width:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:600 13.5px var(--font-body);text-decoration:none;cursor:pointer;white-space:nowrap}
.ibtn:hover{border-color:#56679b;background:var(--surface-2)}
.ibtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.brandb{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink);text-decoration:none}
.brandb .bk{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:11px;border:1px solid #f4b94270;background:#f4b94216;color:var(--accent)}
.brandb .bt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brandb b{font:900 18px var(--font-display);letter-spacing:.05em;white-space:nowrap}
.brandb small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsp{flex:1}
.srch{position:relative;flex:0 1 420px;min-width:0}
.srch label{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}
.srch label:focus-within{border-color:var(--accent);color:var(--ink)}
.srch input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:500 14.5px var(--font-body);outline:none}
.srch input::placeholder{color:#7e89a8}
.srch input::-webkit-search-cancel-button{filter:invert(.7)}
.qres{position:absolute;top:calc(100% + 8px);right:0;width:min(560px,92vw);max-height:min(70vh,640px);overflow:auto;padding:6px;border-radius:14px;border:1px solid var(--line-2);background:#0d1428;box-shadow:0 18px 50px #000b;z-index:70}
.qres .qh{padding:6px 10px 8px;font-size:13px;color:var(--muted)}
.qres a{display:block;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none}
.qres a:hover,.qres a.sel{background:var(--surface-2)}
.qres a b{display:block;font-size:14.5px}
.qres a small{display:block;font-size:13px;color:var(--muted)}
.qres a span{display:block;margin-top:3px;font-size:13px;color:var(--ink-2);line-height:1.6}
mark{background:#f4b94240;color:#fff;border-radius:3px;padding:0 1px}
mark.hit{background:#f4b942;color:var(--accent-ink);box-shadow:0 0 0 2px #f4b94255}
.tocb{display:none}

/* ---- 全体の枠：目次｜本文｜この章の見出し ---- */
.ebl{display:grid;grid-template-columns:var(--navW) minmax(0,1fr) var(--sideW);gap:0;align-items:start;max-width:1560px;margin:0 auto}
.ebnav{position:sticky;top:var(--hdH);height:calc(100vh - var(--hdH));overflow-y:auto;overscroll-behavior:contain;padding:16px 12px 40px 16px;border-right:1px solid var(--line);scrollbar-width:thin;scrollbar-color:#2f3b60 transparent}
.nv-home{display:flex;align-items:center;gap:8px;padding:9px 12px;margin-bottom:8px;border-radius:11px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;border:1px solid var(--line)}
.nv-home:hover{border-color:#56679b}
.nv-home.on{border-color:#f4b94270;background:#f4b94214;color:var(--accent)}
.nv-part{margin:12px 0 4px}
.nv-ph{display:flex;align-items:center;gap:7px;padding:4px 10px;font:700 13px var(--font-body);color:var(--muted);letter-spacing:.04em}
.nv-ph span{font-size:15px}
.nv-ph small{font:600 12.5px var(--font-num);color:#6d7896}
.ebnav a.ch{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px;align-items:baseline;padding:6px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:13.5px;line-height:1.45}
.ebnav a.ch:hover{background:#ffffff0a;color:var(--ink)}
.ebnav a.ch.on{background:linear-gradient(90deg,#f4b94224,#f4b94206);color:var(--ink);font-weight:700}
.nv-n{font:600 12.5px var(--font-num);color:#6d7896}
.ebnav a.ch.on .nv-n{color:var(--accent)}
.ebmain{min-width:0;padding:28px 40px 80px;outline:none}
.ebside{position:sticky;top:var(--hdH);max-height:calc(100vh - var(--hdH));overflow-y:auto;padding:28px 16px 40px 8px;scrollbar-width:thin}
.ebside b{display:block;font-size:13px;color:var(--muted);letter-spacing:.06em;margin:0 0 8px 10px}
.ebside a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--ink-2);text-decoration:none;font-size:13px;line-height:1.5}
.ebside a:hover{color:var(--ink);border-left-color:#56679b}
.ebside a.on{color:var(--accent);border-left-color:var(--accent)}
.ebscrim{position:fixed;inset:0;z-index:64;background:#000a}

/* ---- 章 ---- */
.ebch{max-width:820px;margin:0 auto}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--ink)}
.ebch-h{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.ebch-h .ebic{flex:none;width:56px;height:56px;display:grid;place-items:center;font-size:30px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.ebch-h small{display:block;font:600 13px var(--font-num);color:var(--accent);letter-spacing:.08em}
.ebch-h h1{margin:0;font:900 clamp(24px,3.2vw,32px)/1.25 var(--font-display);letter-spacing:.02em}
.outl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.outl a{display:inline-block;font-size:13px;color:var(--ink-2);text-decoration:none;padding:4px 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface)}
.outl a:hover{color:var(--ink);border-color:#56679b}
.ebbody{font-size:15px}
.ebbody>*:first-child{margin-top:0}
.ebbody h4{margin:30px 0 10px;padding-top:4px;font:800 18px/1.4 var(--font-display);color:var(--accent);scroll-margin-top:calc(var(--hdH) + 14px)}
.ebbody h5{margin:18px 0 6px;font-size:15px;color:#f4d79a}
.ebbody p,.ebbody li{font-size:15px;line-height:1.9;color:#d8def0}
.ebbody ul,.ebbody ol{padding-left:1.3em}
.ebbody li{margin:3px 0}
.ebbody b{color:#fff}
.eblead{font-size:16.5px!important;line-height:1.85!important;color:#f2f5fc!important;margin:0 0 18px;padding:2px 0 2px 14px;border-left:3px solid var(--accent)}
.ebscroll{overflow-x:auto;max-width:100%;margin:10px 0;-webkit-overflow-scrolling:touch}
.ltable{border-collapse:collapse;width:100%;font-size:14px}
.ltable th,.ltable td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;line-height:1.7}
.ltable thead th{font-size:13px;color:var(--muted);font-weight:700;background:#0d1428;white-space:nowrap}
.ebt tbody th{color:#f4d79a;font-weight:700;white-space:nowrap;width:1%}
.ebt td{color:#d8def0}
.ebt thead+tbody td:first-child{min-width:5.2em}
@media (max-width:767px){.ebt.c4{min-width:520px}.ebt.c5,.ebt.c6{min-width:680px}}
.ebbars{display:flex;flex-direction:column;gap:8px;margin:12px 0 8px}
.ebbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr minmax(96px,170px);gap:12px;align-items:center;font-size:14px}
.ebbn{color:#d8def0;text-align:right}
.ebbt{height:12px;border-radius:99px;background:#ffffff0d;overflow:hidden}.ebbt i{display:block;height:100%;border-radius:99px}
.ebbv{color:var(--ink);font-size:13.5px}.ebbv small{display:block;color:var(--muted);font-size:13px;font-family:var(--font-body)}
.ebfig{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#070b17}
.ebfig figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.ebsvg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.ebnums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.ebnums div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:#0b1122}
.ebnums b{font-size:22px;color:var(--accent)}.ebnums small{font-size:13px;color:var(--muted);text-align:center}
.ebdots{font-size:7px;letter-spacing:1px;color:#7fb2ff;text-align:center;max-width:70px;word-break:break-all;line-height:1.1}
.ebmono{font-family:var(--font-num);font-size:14px;letter-spacing:.05em;color:#f4d79a!important;word-break:break-all}
.ebcode{font-size:13px}.ebcode td{padding:6px 8px!important}.ebcode td div{white-space:nowrap;line-height:1.6}.ebcode th{text-align:center!important}
.ebscripts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.ebscripts div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:#0b1122;text-align:center}
.ebscripts b{font-size:20px;color:#fff}.ebscripts small{font-size:13px;color:var(--muted)}
.ebtl{font-size:14px;line-height:2.1!important;padding:12px 16px;border-radius:12px;background:#0b1122;border:1px solid var(--line)}
.ebc3d{display:block;width:100%;max-width:560px;aspect-ratio:360/220;margin:0 auto 18px;border-radius:14px;border:1px solid var(--line);background:#0a0f1f}
.ebcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--min,200px),100%),1fr));gap:10px;margin:12px 0}
.ebcard{padding:12px 14px;border-radius:12px;border:1px solid var(--line);border-top:3px solid var(--c,var(--line-2));background:linear-gradient(180deg,var(--surface),#0d1426)}
.ebcard b{display:block;font-size:15px;margin-bottom:4px;color:#fff}
.ebcard p{margin:0;font-size:13.5px!important;line-height:1.75!important;color:#cdd5e8!important}
.ebflow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:12px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0b1122}
.ebflow span{font-size:14px;padding:4px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink)}
.ebflow i{font-style:normal;color:var(--accent);font-weight:700}
.ebnote{margin:14px 0;padding:12px 16px;border-radius:12px;border:1px solid #f4b94250;background:#f4b9420d;font-size:14.5px;line-height:1.85;color:#f2e6c8}
.ebnote.cool{border-color:#7fb2ff50;background:#7fb2ff0d;color:#dbe7ff}
.ebnote.warn{border-color:#f06a6a55;background:#f06a6a0d;color:#ffd9d9}
.ebsrc{font-size:13px!important;color:var(--muted)!important;line-height:1.7!important;margin:10px 0 0}
.eblinks{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.ebmap,.ebsee{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13.5px;text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.ebmap:hover,.ebsee:hover{border-color:var(--accent)}
.ebsee{color:var(--cool)}
p .ebsee,li .ebsee,td .ebsee{padding:0;border:0;background:none;display:inline;font-size:inherit;text-decoration:underline;text-underline-offset:3px}

/* ---- 前後の章 ---- */
.ebpager{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:820px;margin:40px auto 0}
.ebpager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-decoration:none}
.ebpager a:hover{border-color:var(--accent)}
.ebpager a small{font-size:13px;color:var(--muted)}
.ebpager a b{font-size:15px}
.ebpager .nx{text-align:right;grid-column:2}

/* ---- 表紙 ---- */
.cover{max-width:1080px;margin:0 auto}
.cv-hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center;padding:26px 28px;border-radius:20px;border:1px solid var(--line-2);background:radial-gradient(600px 300px at 85% 20%,#f4b94218,transparent 70%),linear-gradient(180deg,var(--surface),#0d1426)}
.cv-hero h1{margin:0 0 4px;font:900 clamp(30px,4.4vw,44px)/1.15 var(--font-display);letter-spacing:.04em}
.cv-hero h1 small{display:block;font:700 15px var(--font-body);color:var(--muted);letter-spacing:.1em;margin-top:6px}
.cv-hero .eblead{margin-top:16px}
.cv-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:700 14.5px var(--font-body);text-decoration:none}
.btn:hover{border-color:#56679b}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cv-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cv-stats div{padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b1122;text-align:center}
.cv-stats b{display:block;font:700 26px var(--font-num);color:var(--accent)}
.cv-stats small{font-size:13px;color:var(--muted)}
.cv-parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:20px}
.cv-part{padding:16px 18px 14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),#0d1426);scroll-margin-top:calc(var(--hdH) + 16px)}
.cv-part.flash{border-color:var(--accent);box-shadow:0 0 0 3px #f4b94233}
.cv-part h2{display:flex;align-items:center;gap:10px;margin:0 0 6px;font:900 18px/1.3 var(--font-display)}
.cv-part h2 span{font-size:22px}
.cv-part h2 small{font:600 13px var(--font-num);color:var(--muted)}
.cv-part p{margin:0 0 8px;font-size:13.5px;line-height:1.75;color:#c6cee3}
.cv-part ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.cv-part li a{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;padding:5px 6px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:14px}
.cv-part li a:hover{background:#ffffff0a;color:var(--ink)}
.cv-last{margin-top:14px;font-size:14px;color:var(--muted)}
.cv-foot{margin:28px 0 0;font-size:13px;color:var(--muted);line-height:1.8}

/* ---- 幅ごと ---- */
@media (max-width:1279px){.ebl{grid-template-columns:var(--navW) minmax(0,1fr)}.ebside{display:none}}
@media (min-width:1280px){.outl{display:none}}
@media (max-width:1099px){
  .ebl{grid-template-columns:minmax(0,1fr)}
  .tocb{display:inline-flex}
  .ebnav{position:fixed;top:0;left:0;bottom:0;z-index:65;width:min(86vw,340px);height:auto;padding:calc(14px + var(--sat)) 12px calc(30px + var(--sab));background:#0b1224;border-right:1px solid var(--line-2);box-shadow:20px 0 50px #000a;transform:translateX(-102%);transition:transform .22s ease;visibility:hidden}
  body.nav-open .ebnav{transform:none;visibility:visible}
  .ebmain{padding:22px 26px 70px}
  .cv-hero{grid-template-columns:1fr}
}
@media (max-width:767px){
  :root{--hdH:56px}
  .ebh{padding:var(--sat) 10px 0;gap:8px}
  .brandb small,.backt{display:none}
  .brandb .bk{width:32px;height:32px}
  .brandb b{font-size:17px}
  .ibtn{padding:0 10px}
  .tocb span{display:none}
  .srch{position:absolute;left:0;right:0;top:100%;flex:none;padding:8px 10px;background:#0b1224;border-bottom:1px solid var(--line)}
  body:not(.srch-open) .srch{display:none}
  .srch kbd{display:none}
  .qres{position:fixed;left:8px;right:8px;width:auto;top:calc(var(--hdH) + var(--sat) + 62px);max-height:calc(100vh - var(--hdH) - 90px)}
  .ebmain{padding:16px 14px calc(56px + var(--sab))}
  .ebch-h .ebic{width:46px;height:46px;font-size:25px;border-radius:13px}
  .ebbody p,.ebbody li{font-size:15px;line-height:1.85}
  .ebbody h4{font-size:17px}
  .ebbar{grid-template-columns:96px 1fr 88px;gap:8px;font-size:13px}
  .ebbv{font-size:13px}
  .ebnums,.ebscripts{grid-template-columns:repeat(3,1fr)}
  .ltable{font-size:13.5px}.ltable th,.ltable td{padding:8px 8px}
  .ebpager{grid-template-columns:1fr}.ebpager .nx{grid-column:1}
  .cv-hero{padding:18px 16px}
  .cv-parts{grid-template-columns:1fr}
}
@media (min-width:768px){.srchb{display:none}}
@media print{.ebh,.ebnav,.ebside,.ebpager,.outl,.ebscrim{display:none!important}.ebl{display:block}body{background:#fff;color:#000}.ebbody p,.ebbody li,.ebt td{color:#000!important}}
</style>
</head>
<body>
<a class="skip" href="#ebmain">本文へ</a>
<header class="ebh">
  <button type="button" class="ibtn tocb" id="tocb" aria-controls="ebnav" aria-expanded="false" aria-label="目次を開く"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg><span>目次</span></button>
  <a class="brandb" href="#" aria-label="地球大全の表紙へ"><span class="bk"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10 5.1 7 4.6 3.5 5.1v13.2c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5.1C17 4.6 14 5.1 12 6.6zM12 6.6v13.2"/></svg></span><span class="bt"><b>地球大全</b><small>宇宙人のための地球ガイド</small></span></a>
  <span class="hsp"></span>
  <div class="srch" id="srch" role="search">
    <label><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="地球大全の中を検索" autocomplete="off" aria-label="地球大全の中を検索" aria-controls="qres"><kbd>/</kbd></label>
    <div class="qres" id="qres" role="listbox" hidden></div>
  </div>
  <button type="button" class="ibtn srchb" id="srchb" aria-label="検索" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  <a class="ibtn" href="__MAP_URL__" title="カルダシェフ文明マップへ"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.3"/><ellipse cx="12" cy="12" rx="9.6" ry="4.3" transform="rotate(-24 12 12)"/></svg><span class="backt">文明マップへ</span></a>
</header>
<div class="ebl">
  <nav class="ebnav" id="ebnav" aria-label="地球大全の目次"></nav>
  <main class="ebmain" id="ebmain" tabindex="-1"></main>
  <aside class="ebside" id="ebside" aria-label="この章の見出し"></aside>
</div>
<div class="ebscrim" id="scrim" hidden></div>
<script>
__EBCORE__
__EBCH__
</script>
<script>
/* 3D（章の中の小さな立体図）：必要になったときだけ three.js を読み込んでから動かす */
__MOL3D__
window.__initL3D=function(){
__LAWS3D__
};
</script>
<script>
/* ---------- 読む画面：表紙・目次・章・検索 ---------- */
(()=>{
  const $=id=>document.getElementById(id);
  const {parts,chapters}=EB;
  const byId=Object.fromEntries(chapters.map(c=>[c.id,c]));
  const pById=Object.fromEntries(parts.map(p=>[p.id,p]));
  const pLabel=p=>{const i=parts.indexOf(p);return i===0?"序":`第${i}部`;};
  const nav=$("ebnav"),main=$("ebmain"),side=$("ebside"),q=$("q"),qres=$("qres"),body=document.body;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const plain=h=>h.replace(/<(script|style)[\s\S]*?<\/\1>/g," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim();
  const norm=s=>s.normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

  // ---- 目次 ----
  nav.innerHTML=`<a class="nv-home" href="#" data-id=""><span aria-hidden="true">📘</span>表紙と全体の目次</a>`+parts.map(p=>`<div class="nv-part"><div class="nv-ph"><span aria-hidden="true">${p.ic}</span><small>${pLabel(p)}</small>${p.t}</div>${p.ch.map(c=>`<a class="ch" href="#${c.id}" data-id="${c.id}"><span class="nv-n">${c.n}</span><span>${c.t}</span></a>`).join("")}</div>`).join("");

  // ---- 検索の材料（本文の文字だけ） ----
  const IDX=chapters.map(c=>{const hs=[...c.h.matchAll(/<h4[^>]*>([\s\S]*?)<\/h4>/g)].map(m=>plain(m[1]));const t=plain(c.h);return {c,t,nt:norm(t),nti:norm(c.t+" "+(c.k||"")),hs,nhs:hs.map(norm)};});

  // ---- 3D ----
  let l3d=null;
  function load3d(){if(l3d)return l3d;l3d=new Promise(res=>{const init=()=>{if(!window.L3D&&window.__initL3D){try{window.__initL3D();}catch(e){console.error(e);}}res();};if(window.THREE){init();return;}const s=document.createElement("script");s.src="__THREE_URL__";s.onload=init;s.onerror=()=>res();document.head.appendChild(s);});return l3d;}

  // ---- 表紙 ----
  function cover(pid){
    const last=byId[store.get("eb:last")];
    const tables=(chapters.map(c=>c.h).join("").match(/<table/g)||[]).length;
    main.innerHTML=`<section class="cover">
      <div class="cv-hero"><div><h1>地球大全<small>宇宙人のための地球ガイド</small></h1>
        <p class="eblead">地球の外から来た知的存在が「地球とは何か、人類とは何か」を理解するための手引きです。数と物質から始めて、宇宙・地球・生命・人間・社会・文化・技術・歴史まで、この世界のしくみを順に説明します。</p>
        <div class="cv-act"><a class="btn pri" href="#${chapters[0].id}">最初から読む</a>${last?`<a class="btn" href="#${last.id}">続きから：${esc(last.t)}</a>`:""}<a class="btn" href="__MAP_URL__">文明マップで見る</a></div></div>
        <div class="cv-stats"><div><b>${parts.length-1}</b><small>部（＋序）</small></div><div><b>${chapters.length}</b><small>章</small></div><div><b>${tables}</b><small>表</small></div><div><b>${IDX.reduce((a,x)=>a+x.hs.length,0)}</b><small>見出し</small></div></div></div>
      <div class="cv-parts">${parts.map(p=>`<section class="cv-part" id="part-${p.id}"><h2><span aria-hidden="true">${p.ic}</span><small>${pLabel(p)}</small>${p.t}</h2><p>${p.desc}</p><ol>${p.ch.map(c=>`<li><a href="#${c.id}"><span class="nv-n">${c.n}</span><span>${c.t}</span></a></li>`).join("")}</ol></section>`).join("")}</div>
      <p class="cv-foot">数字は概数です。年によって変わる数字には、年と出典を添えています（各章の終わりの「出典・注」）。2027年より後のことは予測や想像で、文明マップの「もしもの世界（Type I〜IV）」とつながっています。</p>
    </section>`;
    side.innerHTML="";document.title="地球大全 — 宇宙人のための地球ガイド";
    setOn("");
    if(pid){const el=$("part-"+pid);if(el){el.scrollIntoView({block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600);}}else window.scrollTo(0,0);
  }

  // ---- 章 ----
  let curId=null;
  function chapter(c,sec,terms){
    const p=pById[c.part],prev=chapters[c.n-1],next=chapters[c.n+1];
    main.innerHTML=`<article class="ebch" data-id="${c.id}">
      <nav class="crumb" aria-label="現在地"><a href="#">地球大全</a><span aria-hidden="true">›</span><a href="#part-${p.id}">${pLabel(p)} ${p.t}</a></nav>
      <header class="ebch-h"><span class="ebic" aria-hidden="true">${c.ic}</span><div><small>第${c.n}章</small><h1>${c.t}</h1></div></header>
      <ul class="outl" aria-label="この章の見出し"></ul>
      ${c.c3d?`<canvas class="c3d ebc3d" data-k="${c.c3d}" data-hi="2" aria-label="${esc(c.t)}の立体図"></canvas>`:""}
      <div class="ebbody">${c.h}</div>
    </article>
    <nav class="ebpager" aria-label="前後の章">${prev?`<a class="pv" href="#${prev.id}"><small>← 前の章（第${prev.n}章）</small><b>${prev.t}</b></a>`:""}${next?`<a class="nx" href="#${next.id}"><small>次の章（第${next.n}章） →</small><b>${next.t}</b></a>`:`<a class="nx" href="#"><small>おわり</small><b>表紙へ戻る</b></a>`}</nav>`;
    const hs=[...main.querySelectorAll(".ebbody h4")];
    hs.forEach((h,k)=>h.id=`${c.id}.${k+1}`);
    const links=hs.map((h,k)=>`<a href="#${c.id}.${k+1}" data-k="${k+1}">${esc(h.textContent)}</a>`);
    main.querySelector(".outl").innerHTML=links.map(a=>`<li>${a}</li>`).join("");
    if(!hs.length)main.querySelector(".outl").remove();
    side.innerHTML=hs.length?`<b>この章の見出し</b>${links.join("")}`:"";
    document.title=`${c.t} — 地球大全`;
    setOn(c.id);curId=c.id;store.set("eb:last",c.id);
    if(terms&&terms.length)highlight(terms);
    const target=sec?document.getElementById(`${c.id}.${sec}`):main.querySelector("mark.hit");
    if(target)target.scrollIntoView({block:terms&&!sec?"center":"start"});else window.scrollTo(0,0);
    if(main.querySelector("canvas.c3d"))load3d().then(()=>{if(window.L3D)L3D.scan(main);});
    watchSections(hs);
  }
  function setOn(id){nav.querySelectorAll("[data-id]").forEach(a=>{const on=a.dataset.id===id;a.classList.toggle("on",on);if(on){a.setAttribute("aria-current","page");}else a.removeAttribute("aria-current");});
    const a=nav.querySelector(`a.ch[data-id="${id}"]`);if(a){const r=a.getBoundingClientRect(),nr=nav.getBoundingClientRect();if(r.top<nr.top+40||r.bottom>nr.bottom-20)a.scrollIntoView({block:"center"});}}
  // 読んでいる見出しを右の一覧で示す
  let so=null;
  function watchSections(hs){if(so)so.disconnect();if(!hs.length)return;so=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){side.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id));}});},{rootMargin:"-20% 0px -70% 0px"});hs.forEach(h=>so.observe(h));}
  // 検索語を本文の中で光らせる
  function highlight(terms){const root=main.querySelector(".ebch");const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);let n=0;
    for(const tn of nodes){if(n>60)break;const s=tn.nodeValue,ns=norm(s);let hit=-1,len=0;for(const t of terms){const i=ns.indexOf(t);if(i>=0&&(hit<0||i<hit)){hit=i;len=t.length;}}if(hit<0||tn.parentNode.closest("mark,script,style"))continue;
      const m=document.createElement("mark");m.className=n?"":"hit";const r=document.createRange();r.setStart(tn,hit);r.setEnd(tn,Math.min(s.length,hit+len));try{r.surroundContents(m);n++;}catch(e){}}}

  // ---- 行き先（#章 / #章.見出し / #part-部） ----
  let pendingTerms=null;
  function route(){
    const h=decodeURIComponent(location.hash.slice(1));closeNav();
    if(!h){cover();return;}
    if(h.startsWith("part-")){cover(h.slice(5));return;}
    const [id,sec]=h.split(".");const c=byId[id];
    if(!c){cover();return;}
    if(c.id===curId&&sec&&!pendingTerms){const el=document.getElementById(`${c.id}.${sec}`);if(el){el.scrollIntoView({block:"start"});return;}}
    const t=pendingTerms;pendingTerms=null;chapter(c,sec,t);
  }
  window.addEventListener("hashchange",route);

  // ---- 検索 ----
  let sel=-1,res=[];
  function search(raw){
    const terms=norm(raw).split(/[\s　]+/).filter(Boolean);
    if(!terms.length){qres.hidden=true;return;}
    res=[];
    for(const x of IDX){let sc=0,ok=true;for(const t of terms){const inT=x.nti.includes(t),hi=x.nhs.findIndex(h=>h.includes(t)),cnt=x.nt.split(t).length-1;if(!inT&&hi<0&&!cnt){ok=false;break;}sc+=(inT?30:0)+(hi>=0?12:0)+Math.min(cnt,20);}
      if(!ok)continue;const hi=x.nhs.findIndex(h=>terms.some(t=>h.includes(t)));const i=x.nt.indexOf(terms[0]);
      const snip=i>=0?x.t.slice(Math.max(0,i-36),i+70):x.t.slice(0,90);res.push({x,sc,hi,snip});}
    res.sort((a,b)=>b.sc-a.sc);sel=res.length?0:-1;
    const mk=s=>{let o=esc(s);terms.forEach(t=>{const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");o=o.replace(re,m=>`<mark>${m}</mark>`);});return o;};
    qres.innerHTML=`<div class="qh">「${esc(raw)}」— ${res.length}章で見つかりました${res.length>40?"（上位40件）":""}</div>`+res.slice(0,40).map((r,k)=>{const c=r.x.c;return `<a href="#${c.id}${r.hi>=0?"."+(r.hi+1):""}" data-k="${k}" role="option"${k===sel?' class="sel"':""}><b>${mk(c.t)}</b><small>第${c.n}章 ・ ${pLabel(pById[c.part])} ${pById[c.part].t}${r.hi>=0?" ・ "+esc(r.x.hs[r.hi]):""}</small><span>…${mk(r.snip)}…</span></a>`;}).join("")+(res.length?"":`<div class="qh">見つかりませんでした。言い方を変えるか、<a href="__MAP_URL__" style="display:inline;padding:0;color:var(--cool)">文明マップ</a>の検索も試してください。</div>`);
    qres.hidden=false;qres._terms=terms;
  }
  let qt=0;q.addEventListener("input",()=>{clearTimeout(qt);qt=setTimeout(()=>search(q.value),120);});
  q.addEventListener("focus",()=>{if(q.value.trim())search(q.value);});
  q.addEventListener("keydown",e=>{const items=[...qres.querySelectorAll("a[data-k]")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!items.length)return;sel=(sel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((a,k)=>a.classList.toggle("sel",k===sel));items[sel].scrollIntoView({block:"nearest"});}
    else if(e.key==="Enter"){e.preventDefault();const a=items[Math.max(0,sel)];if(a)a.click();}
    else if(e.key==="Escape"){qres.hidden=true;q.blur();}});
  qres.addEventListener("click",e=>{const a=e.target.closest("a[data-k]");if(!a)return;e.preventDefault();pendingTerms=qres._terms;qres.hidden=true;q.blur();body.classList.remove("srch-open");$("srchb").setAttribute("aria-expanded","false");
    const h=a.getAttribute("href");if(location.hash===h)route();else location.hash=h;});
  document.addEventListener("click",e=>{if(!e.target.closest("#srch"))qres.hidden=true;});
  $("srchb").addEventListener("click",()=>{const on=body.classList.toggle("srch-open");$("srchb").setAttribute("aria-expanded",String(on));if(on)setTimeout(()=>q.focus(),30);else qres.hidden=true;});

  // ---- 目次（スマホ・タブレットは引き出し） ----
  const tocb=$("tocb"),scrim=$("scrim");
  function openNav(){body.classList.add("nav-open");scrim.hidden=false;tocb.setAttribute("aria-expanded","true");const a=nav.querySelector("a.on")||nav.querySelector("a");setTimeout(()=>{if(a)a.scrollIntoView({block:"center"});},30);}
  function closeNav(){if(!body.classList.contains("nav-open"))return;body.classList.remove("nav-open");scrim.hidden=true;tocb.setAttribute("aria-expanded","false");}
  tocb.addEventListener("click",()=>body.classList.contains("nav-open")?closeNav():openNav());
  scrim.addEventListener("click",closeNav);
  nav.addEventListener("click",e=>{if(e.target.closest("a"))closeNav();});

  // ---- キー操作：/ 検索、← → 前後の章、Esc 閉じる ----
  document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(e.key==="Escape"){closeNav();qres.hidden=true;}
    if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==="/"){e.preventDefault();if(innerWidth<768){body.classList.add("srch-open");}q.focus();q.select();}
    else if((e.key==="ArrowRight"||e.key==="ArrowLeft")&&curId&&location.hash){const c=byId[curId];const t=chapters[c.n+(e.key==="ArrowRight"?1:-1)];if(t)location.hash=t.id;}});

  // ---- はじめ ----
  const qs=new URLSearchParams(location.search).get("q");
  route();
  if(qs){q.value=qs;if(innerWidth<768){body.classList.add("srch-open");$("srchb").setAttribute("aria-expanded","true");}search(qs);}
})();
</script>
